# Runtime of the lab agents: kagent's native harness, run by Agent Substrate on
# the gVisor worker pool. Snapshots go to the bucket of Substrate's bundled
# object store (rustfs).
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: lab-harness
  namespace: kagent
spec:
  kagent: {}
  workload:
    # golang-adk 1.0.0, pinned by digest.
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:f62e9f2820d3325ca147a5d39802dc3e9c914bee97b3e021bd38f6f5df10e3bf
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
